name: Backend V2 Production CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Production에 배포할 ECR 이미지의 Git SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy V2 Production
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      github_environment: production
      image_tag: ${{ inputs.image_tag }}
      verify_dev_match: true
    secrets: inherit

  record-production-deployment:
    name: Record Production Deployment
    needs: deploy-production
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Deployed Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
          fetch-depth: 0

      - name: Create Production Tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          PRODUCTION_TAG="prod-$(TZ=Asia/Seoul date +%Y%m%d)-${GITHUB_RUN_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$PRODUCTION_TAG" "$IMAGE_TAG" -m "Production deployment $PRODUCTION_TAG"
          git push origin "$PRODUCTION_TAG"
