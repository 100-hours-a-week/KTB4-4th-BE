name: Backend V2 Staging CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Staging에 배포할 ECR 이미지의 Git SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy V2 Staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      github_environment: staging
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
