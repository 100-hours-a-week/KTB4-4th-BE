name: Backend V2 Staging CD

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Staging에 배포할 ECR 이미지의 Git SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy V2 Staging
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      github_environment: staging
      image_sha: ${{ inputs.image_sha }}
    secrets: inherit
