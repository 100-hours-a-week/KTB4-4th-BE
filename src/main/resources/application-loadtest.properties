management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.tomcat.mbeanregistry.enabled=true
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}

needu.rate-limit.enabled=false
ai.server.mock-enabled=true
ai.server.mock-latency=${AI_SERVER_MOCK_LATENCY:2s}
ai.server.mock-max-turns=${AI_SERVER_MOCK_MAX_TURNS:2}
# 부하 테스트에서는 목 답변 조각 사이에 기다리지 않아 mock-latency만 AI 응답 시간으로 본다
ai.server.mock-reply-chunk-interval=0s
