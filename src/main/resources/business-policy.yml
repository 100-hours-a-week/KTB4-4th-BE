auth:
  jwt:
    access-token-expiration: 15m
  refresh-token-expiration: 14d
  # 동시 재발급 경합에서 늦게 도착한 직전 리프레시 토큰을 인정하는 시간이다.
  refresh-token-reuse-grace: 10s

ai:
  chat:
    # AI 세션 생성 요청보다 오래 PENDING이면 비정상 종료로 정리한다.
    pending-timeout: ${AI_CHAT_PENDING_TIMEOUT:1m}
    # 취향 분석 완료 후 새 AI 대화를 시작할 수 있을 때까지의 대기 시간이다.
    completion-cooldown: ${AI_CHAT_COMPLETION_COOLDOWN:24h}
    # 지정된 카카오 external ID에는 짧은 완료 쿨다운을 적용한다.
    short-cooldown-external-ids: ${AI_CHAT_SHORT_COOLDOWN_EXTERNAL_IDS:}
    short-completion-cooldown: ${AI_CHAT_SHORT_COMPLETION_COOLDOWN:5m}
    # 하루에 새로 시작할 수 있는 AI 대화 수다(첫 대화 1 + 재대화 5). 새 대화마다 LLM을 호출하므로 재대화 반복 비용을 막는다.
    # short-cooldown-external-ids 계정에는 적용하지 않는다.
    daily-conversation-limit: ${AI_CHAT_DAILY_CONVERSATION_LIMIT:6}
    # 하루 대화 한도가 초기화되는 기준 시간대다. 이 시간대의 자정에 초기화된다.
    daily-conversation-limit-zone: ${AI_CHAT_DAILY_CONVERSATION_LIMIT_ZONE:Asia/Seoul}
    # 같은 대화방의 메시지가 처리 중일 때 클라이언트에 안내할 재시도 시간이다.
    message-retry-after: ${AI_CHAT_MESSAGE_RETRY_AFTER:10s}
    # AI 대화 SSE 연결 유지 시간이다. 지나면 FE EventSource가 자동으로 다시 연결한다.
    stream-timeout: ${AI_CHAT_STREAM_TIMEOUT:30m}
    # nginx proxy_read_timeout보다 짧게 둬서 유휴 연결이 끊기지 않게 한다.
    stream-heartbeat-interval: ${AI_CHAT_STREAM_HEARTBEAT_INTERVAL:25s}
    # 연결 하나에 보내지 못하고 쌓인 이벤트가 이 수를 넘으면 그 연결을 끊는다. FE는 다시 연결해 메시지 목록으로 복구한다.
    stream-max-pending-events: ${AI_CHAT_STREAM_MAX_PENDING_EVENTS:1000}
    # 인스턴스 하나가 동시에 만드는 AI 답변 수다. 넘으면 사용자 메시지를 저장하지 않고 503으로 거절해 AI 서버를 보호한다.
    reply-max-concurrency: ${AI_CHAT_REPLY_MAX_CONCURRENCY:200}
    # 서버 종료 시 진행 중인 답변 생성을 기다리는 시간이다. 지나면 큐를 쓰는 답변은 대기열로 돌려보내고, 받은 서버가 바로 처리하는 답변은 중단하고 error 이벤트를 보낸다.
    # 웹 서버 종료 대기(최대 30초) + 이 값 + 5초가 Pod 종료 유예에서 preStop을 뺀 시간 안에 끝나야 한다. 유예 130초·preStop 10초 기준 30 + 80 + 5 ≤ 120.
    reply-shutdown-timeout: ${AI_CHAT_REPLY_SHUTDOWN_TIMEOUT:80s}
    reply-queue:
      # 켜면 메시지를 받은 서버가 답변을 직접 만들지 않고 답변 작업 스트림에 넣는다. 끄면 지금처럼 받은 서버가 처리한다.
      enabled: ${AI_CHAT_REPLY_QUEUE_ENABLED:false}
      # 켜면 이 인스턴스가 답변 작업 스트림을 소비해 답변을 만들고, 빠진 작업을 다시 넣는 스케줄러도 돌린다. enabled가 꺼져 있으면 켤 수 없다.
      # 워커 전용 인스턴스는 ai-worker 프로필로 띄운다 (application-ai-worker.properties).
      worker-enabled: ${AI_CHAT_REPLY_WORKER_ENABLED:false}
      # AI 서버 전체에 동시에 보내는 답변 수다. BE 인스턴스 수와 상관없이 Redis에서 함께 센다.
      # AI 서버 1대 한계 60(부하 테스트) × 0.8(임시) = 48, AI 서버 2대 기준. 운영 대수와 모델 쪽 한도를 확인해 조정
      global-max-concurrency: ${AI_CHAT_REPLY_GLOBAL_MAX_CONCURRENCY:96}
      # 스트림에 쌓인 답변 작업(처리 중 포함)이 이 수 이상이면 사용자 메시지를 저장하지 않고 503으로 거절한다. 대기열이 끝없이 쌓이지 않게 한다.
      # 임시값이다. 부하 테스트 결과로 조정한다.
      max-length: ${AI_CHAT_REPLY_MAX_LENGTH:800}
      # 워커가 연장하지 않으면 허가가 풀리는 시간이다. 죽은 워커가 반납하지 못한 허가는 이 시간이 지나면 다시 쓸 수 있다.
      permit-ttl: ${AI_CHAT_REPLY_PERMIT_TTL:30s}
      # 같은 작업을 이 횟수보다 많이 할당받으면 더 처리하지 않고 실패로 닫는다. 처리할 때마다 서버를 죽이는 작업이 계속 돌지 않게 한다.
      max-deliveries: ${AI_CHAT_REPLY_MAX_DELIVERIES:3}
      # 처리 중인 워커가 작업·대화방 락·생성 중 표시·전역 허가를 연장하는 주기다. 회수 기준의 1/6로 둬 한두 번 늦어도 회수되지 않게 한다.
      heartbeat-interval: ${AI_CHAT_REPLY_HEARTBEAT_INTERVAL:5s}
      # 이 시간 동안 하트비트가 없는 작업은 처리하던 워커가 멈춘 것으로 보고 다른 워커가 회수한다.
      claim-min-idle: ${AI_CHAT_REPLY_CLAIM_MIN_IDLE:30s}
      # 워커가 멈춘 작업을 회수하러 확인하는 주기다.
      claim-interval: ${AI_CHAT_REPLY_CLAIM_INTERVAL:5s}
      # 꺼낼 작업이나 처리할 자리가 없을 때 다시 확인하기까지 쉬는 시간이다.
      poll-interval: ${AI_CHAT_REPLY_POLL_INTERVAL:200ms}
      # 회수한 작업을 AI 서버가 "같은 대화 처리 중"으로 거절하면 이만큼 기다렸다 다시 부른다. 다시 부를 때마다 두 배로 늘린다.
      turn-in-progress-retry-delay: ${AI_CHAT_REPLY_TURN_IN_PROGRESS_RETRY_DELAY:2s}
      # 스트림에서 빠진 작업을 DB 기준으로 다시 넣는 스케줄러의 실행 주기다. 인스턴스 하나에서만 돈다.
      reconcile-interval: ${AI_CHAT_REPLY_RECONCILE_INTERVAL:10s}
      # 이 시간 넘게 갱신이 없는 대기·처리 중 작업만 스트림에 남아 있는지 확인한다. 접수 직후 기록 전인 작업을 건드리지 않게 한다.
      reconcile-stale-after: ${AI_CHAT_REPLY_RECONCILE_STALE_AFTER:15s}
      reconcile-lock-at-most-for: ${AI_CHAT_REPLY_RECONCILE_LOCK_AT_MOST_FOR:1m}
      reconcile-lock-at-least-for: ${AI_CHAT_REPLY_RECONCILE_LOCK_AT_LEAST_FOR:5s}
      # 대기열 길이·처리 중 수·가장 오래 기다린 시간·전역 허가 사용 수를 Redis에서 읽어 지표에 반영하는 주기다. 인스턴스마다 읽는다.
      metrics-interval: ${AI_CHAT_REPLY_METRICS_INTERVAL:5s}

needu:
  messaging:
    stream:
      # 스트림 하나에 남겨 두는 최대 엔트리 수다(근사값). 넘으면 오래된 것부터 지워지고, ACK 전 메시지도 함께 지워진다.
      # 처리된 메시지는 ACK와 함께 지우므로 남는 건 밀린 메시지뿐이다.
      # 생일 배치 하루치(수신자 89만 명 / 500명 묶음 = 약 1,800개)의 5배 정도로 둔다
      max-length: ${MESSAGING_STREAM_MAX_LENGTH:10000}
      worker:
        # 이 인스턴스에서 스트림 메시지를 읽어 처리할지 정한다. 끄면 발행만 하고 소비하지 않는다.
        enabled: ${MESSAGING_STREAM_WORKER_ENABLED:true}
        # topic 하나당 동시에 처리하는 메시지 수다. 비어 있는 슬롯 수만큼만 읽어 와 처리하지 못할 만큼 가져가지 않는다.
        concurrency: ${MESSAGING_STREAM_WORKER_CONCURRENCY:8}
        # 한 번에 읽어 오는 최대 메시지 수다. 실제로는 비어 있는 슬롯 수와 이 값 중 작은 만큼 읽는다.
        max-read-count: ${MESSAGING_STREAM_WORKER_MAX_READ_COUNT:10}
        # 읽을 메시지가 없거나 Redis 오류가 났을 때 다시 읽기 전까지 쉬는 시간이다.
        poll-interval: ${MESSAGING_STREAM_WORKER_POLL_INTERVAL:500ms}
        # 서버 종료 시 처리 중인 메시지를 기다리는 시간이다. 지나면 중단하고, 중단된 메시지는 ACK 전이라 다시 처리된다. ECS stopTimeout보다 짧게 둔다.
        shutdown-timeout: ${MESSAGING_STREAM_WORKER_SHUTDOWN_TIMEOUT:20s}
  user:
    withdrawal:
      lock-ttl: ${USER_WITHDRAWAL_LOCK_TTL:120s}
  notification:
    stream-timeout: ${NOTIFICATION_STREAM_TIMEOUT:30m}
    heartbeat-interval: ${NOTIFICATION_HEARTBEAT_INTERVAL:25s}
    # 같은 알림을 받는 사용자를 Redis 메시지 하나에 묶는 최대 인원이다
    publish-chunk-size: ${NOTIFICATION_PUBLISH_CHUNK_SIZE:500}
    # 한 알림 이벤트의 수신자 알림을 INSERT 한 문장에 묶는 최대 행 수다
    insert-chunk-size: ${NOTIFICATION_INSERT_CHUNK_SIZE:1000}
    friend-birthday:
      cron: ${FRIEND_BIRTHDAY_NOTIFICATION_CRON:0 0 9 * * *}
      zone: ${FRIEND_BIRTHDAY_NOTIFICATION_ZONE:Asia/Seoul}
      # 생일 며칠 전에 알림을 보낼지 지정한다. 0은 생일 당일이다
      reminder-days: ${FRIEND_BIRTHDAY_REMINDER_DAYS:7,5,3,1,0}
      # 한 트랜잭션에서 알림을 만드는 생일 친구 수다. 실패하면 이 수만큼 함께 롤백된다
      chunk-size: ${FRIEND_BIRTHDAY_NOTIFICATION_CHUNK_SIZE:100}
      # 최초 실행 실패 후 전체 배치를 다시 실행하는 최대 횟수와 재시도 간격이다
      max-retry-count: ${FRIEND_BIRTHDAY_NOTIFICATION_MAX_RETRY_COUNT:2}
      retry-delay: ${FRIEND_BIRTHDAY_NOTIFICATION_RETRY_DELAY:5s}
      lock-at-most-for: ${FRIEND_BIRTHDAY_LOCK_AT_MOST_FOR:10m}
      lock-at-least-for: ${FRIEND_BIRTHDAY_LOCK_AT_LEAST_FOR:1m}
  anonymous-chat:
    notification-expiration: ${ANONYMOUS_CHAT_NOTIFICATION_EXPIRATION:30d}
    report:
      # 마지막 정지 이후 받은 신고가 이 수에 이르면 정지한다. 신고는 대화방마다 한 건이다
      block-threshold: ${ANONYMOUS_CHAT_REPORT_BLOCK_THRESHOLD:5}
      block-duration: ${ANONYMOUS_CHAT_REPORT_BLOCK_DURATION:3d}
  friend:
    poke-cooldown: ${FRIEND_POKE_COOLDOWN:1h}
    # 다가오는 친구 이벤트 목록에 오늘부터 며칠 뒤까지 포함할지 지정한다
    upcoming-event-days: ${FRIEND_UPCOMING_EVENT_DAYS:7}
    sync:
      fixed-delay: ${FRIEND_SYNC_FIXED_DELAY:1m}
      batch-size: ${FRIEND_SYNC_BATCH_SIZE:20}
      max-retry-count: ${FRIEND_SYNC_MAX_RETRY_COUNT:3}
      retry-delay: ${FRIEND_SYNC_RETRY_DELAY:5m}
      lock-at-most-for: ${FRIEND_SYNC_LOCK_AT_MOST_FOR:10m}
      lock-at-least-for: ${FRIEND_SYNC_LOCK_AT_LEAST_FOR:10s}
  product:
    price-range-cache:
      ttl: ${PRODUCT_PRICE_RANGE_CACHE_TTL:10m}
      maximum-size: ${PRODUCT_PRICE_RANGE_CACHE_MAXIMUM_SIZE:100000}
    activity:
      # AI 대화를 닫을 때 추천 피드백으로 보내는 좋아요·싫어요·구매 기록의 범위다. 오래된 반응은 지금 취향과 다를 수 있어 뺀다
      lookback: ${PRODUCT_ACTIVITY_LOOKBACK:90d}
      # 보내는 기록의 최대 개수다. 최신순으로 자른다
      max-items: ${PRODUCT_ACTIVITY_MAX_ITEMS:200}
    link-click:
      # 같은 사용자-상품-context의 클릭을 다시 기록하지 않는 기간
      duplicate-window: ${PRODUCT_LINK_CLICK_DUPLICATE_WINDOW:1h}
    purchase-check:
      cron: ${PURCHASE_CHECK_CRON:0 */10 * * * *}
      zone: ${PURCHASE_CHECK_ZONE:Asia/Seoul}
      # 링크 클릭 후 구매 여부를 묻기까지의 기간
      delay: ${PURCHASE_CHECK_DELAY:1h}
      # delay가 지난 클릭을 이 기간만큼 거슬러 찾는다. 스케줄러가 며칠 멈춰도 놓치지 않고, 이보다 오래된 클릭은 묻지 않는다
      lookback: ${PURCHASE_CHECK_LOOKBACK:3h}
      batch-size: ${PURCHASE_CHECK_BATCH_SIZE:100}
      lock-at-most-for: ${PURCHASE_CHECK_LOCK_AT_MOST_FOR:10m}
      lock-at-least-for: ${PURCHASE_CHECK_LOCK_AT_LEAST_FOR:10s}
      # 구매 여부 확인 알림이 알림 목록에 남아 있는 기간
      notification-expiration: ${PURCHASE_CHECK_NOTIFICATION_EXPIRATION:7d}

