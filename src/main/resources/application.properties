spring.application.name=NEEDU-BE
spring.config.import=optional:file:./.env[.properties],classpath:business-policy.yml,classpath:rate-limit.yml
spring.datasource.url=jdbc:mysql://localhost:3306/needu
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
kakao.oauth.client-id=${KAKAO_REST_API_KEY}
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET}
kakao.oauth.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.oauth.friend-redirect-uri=${KAKAO_FRIEND_REDIRECT_URI}
auth.jwt.secret=${JWT_SECRET}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
ai.server.connect-timeout=${AI_SERVER_CONNECT_TIMEOUT:3s}
ai.server.read-timeout=${AI_SERVER_READ_TIMEOUT:30s}
# AI 메시지 전송은 답변 생성과 취향 추출을 마친 뒤 응답한다(AI 명세 3번). 다른 API보다 길게 잡는다.
ai.server.message-read-timeout=${AI_SERVER_MESSAGE_READ_TIMEOUT:90s}
# 로컬 FE 연동 시 AI 서버 호출 없이 대화 생성/메시지/분석 목 응답을 사용한다.
ai.server.mock-enabled=${AI_SERVER_MOCK_ENABLED:false}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
# Boot 기본 경로(classpath:schema.sql)에 두면 H2 테스트에서 자동 실행돼 깨지므로 db/ 아래에 둔다.
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 기본은 health만 노출한다. metrics 엔드포인트가 필요한 진단 환경에서만 별도로 추가한다.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
# DB/디스크 등 내부 상태가 인증 없이 드러나지 않도록 상세 정보는 내려주지 않는다.
management.endpoint.health.show-details=never
# Redis는 아직 사용하지 않는다. 연결이 없어도 health가 DOWN이 되지 않게 제외한다. Redis 도입 시 이 줄을 제거한다.
management.health.redis.enabled=false

# CloudWatch 메트릭은 운영 환경에서만 명시적으로 활성화한다.
spring.cloud.aws.cloudwatch.enabled=${CLOUDWATCH_METRICS_ENABLED:false}
spring.cloud.aws.cloudwatch.region=${AWS_REGION:ap-northeast-2}
management.cloudwatch.metrics.export.namespace=${CLOUDWATCH_METRICS_NAMESPACE:NeedU/Backend}
management.cloudwatch.metrics.export.step=${CLOUDWATCH_METRICS_STEP:1m}

# Sentry는 sentry-spring-boot-4 auto-configuration으로만 초기화한다. @EnableSentry를 함께 쓰면 sentryHub Bean이 중복 등록된다.
# DSN은 SENTRY_DSN 환경변수가 sentry.dsn으로 바인딩되며, 값이 없으면 Sentry auto-configuration이 동작하지 않는다.
sentry.send-default-pii=false
