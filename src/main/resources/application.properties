spring.application.name=NEEDU-BE
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/needu
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
kakao.oauth.client-id=${KAKAO_REST_API_KEY}
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET}
kakao.oauth.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.oauth.friend-redirect-uri=${KAKAO_FRIEND_REDIRECT_URI}
auth.jwt.secret=${JWT_SECRET}
auth.jwt.access-token-expiration=15m
auth.refresh-token-expiration=14d
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
ai.server.connect-timeout=${AI_SERVER_CONNECT_TIMEOUT:3s}
ai.server.read-timeout=${AI_SERVER_READ_TIMEOUT:30s}
# AI 메시지 전송은 답변 생성과 취향 추출을 마친 뒤 응답한다(AI 명세 3번). 다른 API보다 길게 잡는다.
ai.server.message-read-timeout=${AI_SERVER_MESSAGE_READ_TIMEOUT:90s}
# AI 세션 생성 요청(read-timeout)보다 오래 PENDING으로 남은 대화방은 비정상 종료로 보고 정리한다.
ai.chat.pending-timeout=${AI_CHAT_PENDING_TIMEOUT:1m}
# AI 서버 세션 만료 규칙(AI 명세 2번). AI 서버 규칙이 바뀌면 함께 변경한다.
ai.chat.session-idle-timeout=${AI_CHAT_SESSION_IDLE_TIMEOUT:30m}
ai.chat.session-max-duration=${AI_CHAT_SESSION_MAX_DURATION:2h}
ai.chat.session-expiry-margin=${AI_CHAT_SESSION_EXPIRY_MARGIN:1m}
# 같은 대화방의 이전 메시지를 아직 처리 중일 때 FE에 알려줄 재시도 대기 시간
ai.chat.message-retry-after=${AI_CHAT_MESSAGE_RETRY_AFTER:10s}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

needu.rate-limit.policies.personal-recommendations.method=GET
needu.rate-limit.policies.personal-recommendations.path-pattern=/api/v1/users/me/personal-recommendations
needu.rate-limit.policies.personal-recommendations.limit=120
needu.rate-limit.policies.personal-recommendations.window=1m
needu.rate-limit.policies.personal-recommendations.maximum-size=100000

needu.rate-limit.policies.friend-list.method=GET
needu.rate-limit.policies.friend-list.path-pattern=/api/v1/friends
needu.rate-limit.policies.friend-list.limit=120
needu.rate-limit.policies.friend-list.window=1m
needu.rate-limit.policies.friend-list.maximum-size=100000

needu.rate-limit.policies.error-reports.method=POST
needu.rate-limit.policies.error-reports.path-pattern=/api/v1/error-reports
needu.rate-limit.policies.error-reports.limit=30
needu.rate-limit.policies.error-reports.window=1m
needu.rate-limit.policies.error-reports.maximum-size=100000

needu.rate-limit.policies.gift-recommendations.method=GET
needu.rate-limit.policies.gift-recommendations.path-pattern=/api/v1/users/{userId}/gift-recommendations
needu.rate-limit.policies.gift-recommendations.limit=120
needu.rate-limit.policies.gift-recommendations.window=1m
needu.rate-limit.policies.gift-recommendations.maximum-size=100000

needu.rate-limit.policies.ai-conversations.method=POST
needu.rate-limit.policies.ai-conversations.path-pattern=/api/v1/ai/conversations
needu.rate-limit.policies.ai-conversations.limit=30
needu.rate-limit.policies.ai-conversations.window=1m
needu.rate-limit.policies.ai-conversations.maximum-size=100000

needu.rate-limit.policies.ai-messages.method=POST
needu.rate-limit.policies.ai-messages.path-pattern=/api/v1/ai/conversations/{conversationId}/messages
needu.rate-limit.policies.ai-messages.limit=10
needu.rate-limit.policies.ai-messages.window=1m
needu.rate-limit.policies.ai-messages.maximum-size=100000

needu.rate-limit.policies.ai-message-history.method=GET
needu.rate-limit.policies.ai-message-history.path-pattern=/api/v1/ai/conversations/{conversationId}/messages
needu.rate-limit.policies.ai-message-history.limit=120
needu.rate-limit.policies.ai-message-history.window=1m
needu.rate-limit.policies.ai-message-history.maximum-size=100000
