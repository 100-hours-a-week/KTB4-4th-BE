# Application
spring.application.name=NEEDU-BE
spring.config.import=optional:file:./.env[.properties],classpath:business-policy.yml,classpath:anonymous-alias.yml,classpath:rate-limit.yml

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/needu
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.data-source-properties.readOnlyPropagatesToServer=false
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.sql.init.mode=always
# Boot 기본 경로(classpath:schema.sql)에 두면 H2 테스트에서 자동 실행돼 깨지므로 db/ 아래에 둔다.
spring.sql.init.schema-locations=classpath:db/schema.sql

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false
needu.redis.key-prefix=backend

# Kakao OAuth
kakao.oauth.client-id=${KAKAO_REST_API_KEY}
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET}
kakao.oauth.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.oauth.friend-redirect-uri=${KAKAO_FRIEND_REDIRECT_URI}
kakao.oauth.admin-key=${KAKAO_ADMIN_KEY}
kakao.oauth.token-encryption-key=${KAKAO_TOKEN_ENCRYPTION_KEY}
kakao.oauth.refresh-token-expiration=${KAKAO_REFRESH_TOKEN_EXPIRATION:60d}
kakao.oauth.transaction-ttl=${KAKAO_OAUTH_TRANSACTION_TTL:10m}

# Authentication
auth.jwt.secret=${JWT_SECRET}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# AI Server
ai.server.connect-timeout=${AI_SERVER_CONNECT_TIMEOUT:3s}
ai.server.read-timeout=${AI_SERVER_READ_TIMEOUT:30s}
# AI 메시지 전송은 답변 생성과 취향 추출을 마친 뒤 응답한다(AI 명세 3번). 다른 API보다 길게 잡는다.
ai.server.message-read-timeout=${AI_SERVER_MESSAGE_READ_TIMEOUT:90s}
# AI 스트리밍 응답에서 이벤트(: ping 포함) 사이 최대 공백. 턴 전체 시간은 message-read-timeout을 쓴다.
ai.server.stream-idle-timeout=${AI_SERVER_STREAM_IDLE_TIMEOUT:30s}
# 로컬 FE 연동 시 AI 서버 호출 없이 대화 생성/메시지/분석 목 응답을 사용한다.
ai.server.mock-enabled=${AI_SERVER_MOCK_ENABLED:false}
# 목 AI 답변을 delta로 나누는 단위(코드 포인트)와 조각 사이 간격. 목 응답을 스트리밍처럼 보이게 한다.
ai.server.mock-reply-chunk-code-points=${AI_SERVER_MOCK_REPLY_CHUNK_CODE_POINTS:2}
ai.server.mock-reply-chunk-interval=${AI_SERVER_MOCK_REPLY_CHUNK_INTERVAL:30ms}

# AI Chat
ai.chat.lock.ttl=${AI_CHAT_LOCK_TTL:120s}
ai.chat.lock.key-prefix=${needu.redis.key-prefix}:aichat:lock
ai.chat.generation-ttl=${AI_CHAT_GENERATION_TTL:120s}

# Anonymous Chat WebSocket
# 운영은 FE와 같은 origin이라 비워 둔다. 로컬 FE(localhost:3000) 연동 시에만 쉼표로 구분해 지정한다.
anonymous-chat.websocket.allowed-origin-patterns=${ANONYMOUS_CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:}

# Async Executors
needu.async.ai.core-pool-size=${AI_ASYNC_CORE_POOL_SIZE:4}
needu.async.ai.max-pool-size=${AI_ASYNC_MAX_POOL_SIZE:8}
needu.async.ai.queue-capacity=${AI_ASYNC_QUEUE_CAPACITY:50}
needu.async.notification.core-pool-size=${NOTIFICATION_ASYNC_CORE_POOL_SIZE:2}
needu.async.notification.max-pool-size=${NOTIFICATION_ASYNC_MAX_POOL_SIZE:4}
needu.async.notification.queue-capacity=${NOTIFICATION_ASYNC_QUEUE_CAPACITY:100}

# Web Push Notification
notification.webpush.enabled=${WEB_PUSH_ENABLED:false}
notification.webpush.public-key=${VAPID_PUBLIC_KEY:}
notification.webpush.private-key=${VAPID_PRIVATE_KEY:}
notification.webpush.subject=${VAPID_SUBJECT:}
notification.webpush.ttl=${WEB_PUSH_TTL:24h}
notification.webpush.request-timeout=${WEB_PUSH_REQUEST_TIMEOUT:5s}

# Actuator
# 기본은 health만 노출한다. metrics 엔드포인트가 필요한 진단 환경에서만 별도로 추가한다.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
# DB/디스크 등 내부 상태가 인증 없이 드러나지 않도록 상세 정보는 내려주지 않는다.
management.endpoint.health.show-details=never
# Kubernetes probe용으로 liveness/readiness 그룹을 앱 포트의 /livez, /readyz에도 노출한다.
management.endpoint.health.probes.add-additional-paths=true
management.health.redis.enabled=true

# OpenAPI
# API 문서는 CI(OpenApiConfigTest)에서 생성해 Cloudflare Pages에 배포한다. 운영 서버에서는 노출하지 않는다.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
# 어노테이션 없이 받는 요청 객체(@ModelAttribute 생략)도 쿼리 파라미터로 펼쳐 문서화한다.
springdoc.default-flat-param-object=true

# CloudWatch
# CloudWatch 메트릭은 운영 환경에서만 명시적으로 활성화한다.
spring.cloud.aws.cloudwatch.enabled=${CLOUDWATCH_METRICS_ENABLED:false}
spring.cloud.aws.cloudwatch.region=${AWS_REGION:ap-northeast-2}
management.cloudwatch.metrics.export.namespace=${CLOUDWATCH_METRICS_NAMESPACE:NeedU/Backend}
management.cloudwatch.metrics.export.step=${CLOUDWATCH_METRICS_STEP:1m}

# Sentry
# Sentry는 sentry-spring-boot-4 auto-configuration으로만 초기화한다. @EnableSentry를 함께 쓰면 sentryHub Bean이 중복 등록된다.
# DSN은 SENTRY_DSN 환경변수가 sentry.dsn으로 바인딩되며, 값이 없으면 Sentry auto-configuration이 동작하지 않는다.
sentry.send-default-pii=false
