spring.application.name=NEEDU-BE
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/needu
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
kakao.oauth.client-id=${KAKAO_REST_API_KEY}
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET}
kakao.oauth.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.oauth.friend-redirect-uri=${KAKAO_FRIEND_REDIRECT_URI}
auth.jwt.secret=${JWT_SECRET}
auth.jwt.access-token-expiration=15m
auth.refresh-token-expiration=14d
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
ai.server.connect-timeout=${AI_SERVER_CONNECT_TIMEOUT:3s}
ai.server.read-timeout=${AI_SERVER_READ_TIMEOUT:30s}
# AI 메시지 전송은 답변 생성과 취향 추출을 마친 뒤 응답한다(AI 명세 3번). 다른 API보다 길게 잡는다.
ai.server.message-read-timeout=${AI_SERVER_MESSAGE_READ_TIMEOUT:90s}
# 로컬 FE 연동 시 AI 서버 호출 없이 대화 생성/메시지/분석 목 응답을 사용한다.
ai.server.mock-enabled=${AI_SERVER_MOCK_ENABLED:false}
# AI 세션 생성 요청(read-timeout)보다 오래 PENDING으로 남은 대화방은 비정상 종료로 보고 정리한다.
ai.chat.pending-timeout=${AI_CHAT_PENDING_TIMEOUT:1m}
# 같은 대화방의 이전 메시지를 아직 처리 중일 때 FE에 알려줄 재시도 대기 시간
ai.chat.message-retry-after=${AI_CHAT_MESSAGE_RETRY_AFTER:10s}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
# Boot 기본 경로(classpath:schema.sql)에 두면 H2 테스트에서 자동 실행돼 깨지므로 db/ 아래에 둔다.
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 운영 배포 Health Check용. 인증 없이 열리는 경로이므로 health 외 엔드포인트는 노출하지 않는다.
management.endpoints.web.exposure.include=health
# DB/디스크 등 내부 상태가 인증 없이 드러나지 않도록 상세 정보는 내려주지 않는다.
management.endpoint.health.show-details=never
# Redis는 아직 사용하지 않는다. 연결이 없어도 health가 DOWN이 되지 않게 제외한다. Redis 도입 시 이 줄을 제거한다.
management.health.redis.enabled=false

needu.rate-limit.policies.personal-recommendations.method=GET
needu.rate-limit.policies.personal-recommendations.path-pattern=/api/v1/users/me/personal-recommendations
needu.rate-limit.policies.personal-recommendations.limit=120
needu.rate-limit.policies.personal-recommendations.window=1m
needu.rate-limit.policies.personal-recommendations.maximum-size=100000

