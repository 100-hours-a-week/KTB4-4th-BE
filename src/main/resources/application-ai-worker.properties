# AI 답변 워커 전용 인스턴스. 같은 이미지를 SPRING_PROFILES_ACTIVE에 ai-worker를 더해 띄운다 (예: dev,ai-worker)
# 답변 작업 스트림 소비와 빠진 작업 재투입만 맡고, 다른 배치·스트림 소비·Pub/Sub 구독은 API 인스턴스가 맡는다
ai.chat.reply-queue.enabled=true
ai.chat.reply-queue.worker-enabled=true
needu.messaging.stream.worker.enabled=false
# 워커는 이벤트를 발행만 한다. SSE·WebSocket 연결은 API 인스턴스에 있다
needu.redis.pub-sub.enabled=false
