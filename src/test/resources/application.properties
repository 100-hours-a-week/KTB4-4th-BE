kakao.oauth.client-id=test-client-id
kakao.oauth.client-secret=test-client-secret
kakao.oauth.redirect-uri=http://localhost:8080/api/v1/auth/kakao/callback
kakao.oauth.friend-redirect-uri=http://localhost:8080/api/v1/friends/kakao/callback
spring.datasource.url=jdbc:h2:mem:needu;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=create-drop
auth.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
auth.jwt.access-token-expiration=15m
auth.refresh-token-expiration=14d
auth.cookie.secure=false
AI_SERVER_BASE_URL=http://localhost:9000
AI_SERVICE_TOKEN=test-service-token
ai.server.connect-timeout=3s
ai.server.read-timeout=30s
ai.server.message-read-timeout=90s

# 운영(src/main)과 동일하게 맞춘다. test 리소스의 application.properties가 운영 파일을 덮어쓰므로 여기에도 둔다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
