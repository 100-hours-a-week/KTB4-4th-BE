# 통합 테스트(integrationTest 태스크) 전용. 기본값은 CI의 MySQL 서비스 설정과 일치시킨다.
spring.datasource.url=jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:needu_test}?characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TEST_DB_USERNAME:test}
spring.datasource.password=${TEST_DB_PASSWORD:test}
spring.jpa.hibernate.ddl-auto=create-drop
# 운영(src/main)과 동일하게 맞춘다. 누락 시 MySQL 세션 타임존 차이로 LocalDate 값이 밀린다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
