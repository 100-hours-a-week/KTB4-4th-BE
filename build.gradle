plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.sentry.jvm.gradle" version "6.23.0"
}

group = 'kr.ktb.zura'
version = '0.0.1-SNAPSHOT'
description = 'NEEDU-BE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.1.1')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter'
    implementation 'io.micrometer:micrometer-registry-cloudwatch2'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'
    // API 스펙(JSON)만 생성. Swagger UI는 CI가 Cloudflare Pages에 따로 배포
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

sentry {
    // Generates a JVM (Java, Kotlin, etc.) source bundle and uploads your source code to Sentry.
    // This enables source context, allowing you to see your source
    // code as part of your stack traces in Sentry.
    includeSourceContext = System.getenv("SENTRY_AUTH_TOKEN") != null

    org = "ktb4"
    projectName = "needu"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}

def integrationTestPattern = '*IntegrationTest'

tasks.named('test') {
    useJUnitPlatform()
    filter {
        excludeTestsMatching integrationTestPattern
    }
}

// 실제 MySQL이 필요하므로 check/build에 연결하지 않는다. CI의 release-check에서만 실행한다.
tasks.register('integrationTest', Test) {
    group = 'verification'
    description = '실제 MySQL에 연결해 통합 테스트를 실행한다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching integrationTestPattern
    }

    systemProperty 'spring.profiles.active', 'integration'

    shouldRunAfter tasks.named('test')
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
